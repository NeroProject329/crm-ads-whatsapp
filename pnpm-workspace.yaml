packages:
  - apps/*
  - packages/*
  - tooling/*

# Dependências recém-publicadas aguardam antes de entrar automaticamente.
overrides:
  'sharp@<0.35.0': 0.35.3
  'postcss@<=8.5.17': 8.5.23
  'nanoid@<3.3.18': 3.3.18
  '@prisma/config>deepmerge-ts': 8.0.0

minimumReleaseAge: 1440
minimumReleaseAgeExclude: []

# Scripts de instalação são liberados somente após revisão explícita.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
