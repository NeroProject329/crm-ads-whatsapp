packages:
  - apps/*
  - packages/*
  - tooling/*

# Dependências recém-publicadas aguardam antes de entrar automaticamente.
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []

# Scripts de instalação são liberados somente após revisão explícita.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
